name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI 上には Everything が存在しないため、IPC を伴うテストは QSKIP される。
# ビルドが通ることと、Everything 非依存のロジックが壊れていないことを見る。
env:
  QT_VERSION: 6.8.3

jobs:
  format:
    name: format (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pre-commit/action@v3.0.1

  build-test:
    name: build & test (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: ''
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build/ci

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

  package:
    name: package (windeployqt)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Release)
        run: >
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      # 手順はスクリプト側に一本化する。ワークフローに windeployqt の起動を
      # 書き写すと必ず片方だけ古くなる (lint / coverage と同じ理由)。
      # スクリプトは fail-closed: critical artifact が 1 つでも欠ければ
      # dist を消して非ゼロで終わるので、ここでの追加検証は不要。
      #
      # **Everything の IPC は必須にしない。** ランナーに Everything が無いのは
      # 正常であり、このジョブが見るのは Qt の deployment と必須ファイルの存在だけ。
      - name: Package
        run: pwsh scripts/package.ps1 -BuildDir build/ci -Config Release

      - uses: actions/upload-artifact@v4
        with:
          name: efs-windows-x64
          if-no-files-found: error
          path: dist/efs

  lint:
    name: lint (clang-tidy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # compile_commands.json を得るための設定のみ。ビルドは AUTOMOC が生成する
      # ヘッダを揃えるために必要。
      - name: Configure & build
        run: |
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/ci

      # 起動条件はスクリプト側に一本化する。ここに同じコマンドを書くと必ず
      # 片方だけ古くなる (coverage と同じ理由)。ランナーの clang-tidy は
      # ローカルより新しいことがあるので、スクリプトがバージョンを表示する。
      - name: clang-tidy
        run: pwsh scripts/lint.ps1 -BuildDir build/ci

  coverage:
    name: coverage (OpenCppCoverage)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install OpenCppCoverage
        run: choco install opencppcoverage -y --no-progress

      - name: Configure & build (Debug)
        run: |
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build build/ci

      # 起動条件はスクリプト側に一本化する。ここに同じコマンドを書くと必ず
      # 片方だけ古くなる。閾値は設けない — Everything 依存のテストが CI では
      # QSKIP される以上、数値の絶対量に意味が無いため。
      - name: Run coverage
        run: pwsh scripts/coverage.ps1 -BuildDir build/ci -QtBin "$env:QT_ROOT_DIR\bin"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          if-no-files-found: error
          path: build/coverage
